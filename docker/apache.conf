<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    ServerTokens Prod
    ServerSignature Off

    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        # Alles, was keine Datei ist, geht an den Front-Controller
        FallbackResource /index.php
    </Directory>

    # Statische Dateien dürfen lange gecacht werden (CSS/JS tragen keinen Hash, daher moderat)
    <FilesMatch "\.(css|js|png|ico)$">
        Header set Cache-Control "public, max-age=3600"
    </FilesMatch>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
